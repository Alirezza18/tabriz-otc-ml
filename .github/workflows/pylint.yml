name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (code + linter)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      # Informational lint: annotations show inline, but style issues never
      # turn the job red (the required gate is the `tests` workflow).
      - name: Analyse code with pylint (errors only, non-blocking)
        continue-on-error: true
        run: >
          pylint otc_ml scripts
          --errors-only
          --disable=E0401,E0611,E1101,E1121,E1136
          --generated-members=numpy.*
